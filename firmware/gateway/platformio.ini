; Optional: build with PlatformIO (`pio run` in this folder). The Arduino IDE
; works too: open gateway.ino, board "ESP32 Dev Module", install OneWire and
; DallasTemperature from the library manager.
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.pio/>
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
