<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: tablet operator app. Top bar; intake screen; work screen = 3D twin (left) + stage panel (right); report screen */
:root{--bg:#07090b;--panel:#0f1417;--panel2:#151c20;--fg:#eef3f0;--muted:#8a9a93;--line:rgba(255,255,255,.1);--mint:#9fe3b4;--amber:#ffbf3c;--red:#ff5148;
--display:"Barlow Condensed",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.14em}
.logo small{font-weight:400;font-size:15px;letter-spacing:.24em;color:var(--mint);margin-left:10px}
.unit{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.unit b{color:var(--fg);font-weight:500}
.sp{flex:1}
.toggle{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{appearance:none;width:44px;height:26px;border-radius:13px;background:#2a3337;position:relative;cursor:pointer;transition:background .2s;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.toggle input:checked{background:var(--red)}.toggle input:checked::after{left:21px}
.clock{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.screen{flex:1;min-height:0;display:flex}
/* buttons */
.btn{min-height:52px;padding:0 22px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;font-size:16px;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s,opacity .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.btn.primary{background:var(--mint);color:#0a1a10;border-color:var(--mint)}
.btn.warn{background:var(--amber);color:#1f1600;border-color:var(--amber)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
/* intake */
#intake{align-items:center;justify-content:center;overflow-y:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.form{width:min(760px,100%);display:grid;gap:22px}
.form h2{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.06em;margin:0;text-transform:uppercase}
.form p.lead{margin:-12px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f{display:grid;gap:6px}
.f label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.f input,.f select{height:54px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 16px;font-size:17px;min-width:0}
.f input:focus,.f select:focus{outline:2px solid var(--mint);outline-offset:1px}
.f.err input{border-color:var(--red)}
.f .msg{font-size:12px;color:var(--red);min-height:1em}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:54px;height:54px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--bg) inset}
.formfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.formfoot span{font-size:13px;color:var(--muted)}
/* work */
#work{display:none}
.twin{flex:1;min-width:0;position:relative;background:radial-gradient(ellipse at 50% 60%,#16201c,#07090b 70%)}
.twin canvas{display:block}
.rail{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:16px;bottom:16px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;pointer-events:none}
.rs{border-top:3px solid #2a3337;padding-top:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs b{display:block;font-family:var(--display);font-size:18px;color:var(--fg);font-weight:600}
.rs.cur{border-color:#fff;color:var(--fg)}.rs.pass{border-color:var(--mint)}.rs.fail{border-color:var(--red)}
.side{width:420px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
.sh{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.sh h2{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.04em;text-transform:uppercase;margin:4px 0 0;line-height:1.02;text-wrap:balance}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--mono);font-size:13px;padding:5px 10px;border-radius:20px;background:var(--panel2)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.run i{background:var(--amber);animation:bl 1s infinite}.status.pass i{background:var(--mint)}.status.fail i{background:var(--red)}
@keyframes bl{50%{opacity:.25}}
.items{flex:1;min-height:0;overflow-y:auto;padding:8px 12px}
.it{display:grid;grid-template-columns:28px 1fr auto;gap:2px 12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line)}
.it .ic{width:22px;height:22px;border-radius:50%;border:2px solid #3a4549;display:grid;place-items:center;font-size:12px;font-weight:700}
.it.run .ic{border-color:var(--amber);border-top-color:transparent;animation:spin .8s linear infinite}
.it.pass .ic{background:var(--mint);border-color:var(--mint);color:#0a1a10}.it.fail .ic{background:var(--red);border-color:var(--red);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.it .nm{font-weight:500}
.it .src{grid-column:2;font-size:12px;color:var(--muted);font-family:var(--mono)}
.it .val{grid-row:1/3;grid-column:3;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px}
.it .val small{display:block;font-size:11px;color:var(--muted)}
.it.fail .val{color:var(--red)}
.it .cf{grid-row:1/3;grid-column:3;min-height:44px;padding:0 16px;font-size:14px}
.fault{margin:12px;padding:14px 16px;border-radius:10px;background:rgba(255,81,72,.12);border:1px solid rgba(255,81,72,.4);display:grid;gap:4px}
.fault b{color:var(--red);font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.fault span{font-size:14px}
.actions{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line)}
.actions .btn{width:100%}
.bus{height:118px;overflow:hidden;font-family:var(--mono);font-size:11.5px;color:#6f8a7c;padding:8px 16px;border-top:1px solid var(--line);background:#0b0f11;font-variant-numeric:tabular-nums}
.bus div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bus .hl{color:var(--mint)}.bus .hr{color:var(--red)}
/* report */
#report{display:none;overflow-y:auto;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.rep{width:min(900px,100%);display:grid;gap:20px;align-content:start}
.rep h2{font-family:var(--display);font-weight:800;font-size:48px;letter-spacing:.05em;margin:0;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi b{display:block;font-family:var(--display);font-size:40px;font-weight:800;line-height:1}
.kpi span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--panel)}
td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;white-space:nowrap;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.pill.ok{background:rgba(159,227,180,.15);color:var(--mint)}.pill.fx{background:rgba(255,191,60,.15);color:var(--amber)}
/* nav */
.tabs{display:flex;gap:4px;background:var(--panel2);border-radius:10px;padding:4px}
.tab{min-height:40px;padding:0 16px;border:0;border-radius:7px;background:none;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer}
.tab[aria-current="true"]{background:var(--fg);color:var(--bg)}
.tab:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
body:not([data-view="line"]) .lineonly{display:none!important}
/* dashboard */
#dash,#trace{display:none;overflow-y:auto;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.wrap{width:min(1180px,100%);display:grid;gap:18px;align-content:start}
.dh{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.dh h2{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.05em;margin:0;text-transform:uppercase;line-height:1}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;border:1px dashed var(--amber);color:var(--amber);letter-spacing:.04em}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:0;text-transform:none}
.kpi .up{color:var(--mint)}
.cards{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.box h3{margin:0 0 12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.box h3 b{color:var(--fg);font-weight:500;letter-spacing:.04em;text-transform:none;font-family:var(--mono)}
svg.ch{width:100%;height:auto;display:block}
.ch .grid line{stroke:var(--line)}.ch text{fill:var(--muted);font:11px var(--mono)}
.ch .ln{fill:none;stroke:var(--mint);stroke-width:2.5}.ch .ar{fill:var(--mint);opacity:.12}.ch .pt{fill:var(--bg);stroke:var(--mint);stroke-width:2}
.ch .end{fill:var(--mint)}.ch .lbl{fill:var(--fg);font:600 13px var(--mono)}.ch .bar{fill:#2a3337}
.hb{display:grid;grid-template-columns:110px 1fr 34px;gap:8px 10px;align-items:center;font-size:13px}
.hb .tr{height:12px;border-radius:3px;background:var(--panel2);overflow:hidden}.hb .tr i{display:block;height:100%;background:#5d6b70;border-radius:3px}
.hb .tr i.mx{background:var(--red)}
.hb .c{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tf{display:grid;gap:10px}
.tfr{display:grid;grid-template-columns:28px 1fr auto;gap:2px 12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tfr:last-child{border-bottom:0;padding-bottom:0}
.tfr .rk{font-family:var(--display);font-size:22px;font-weight:800;color:var(--muted)}
.tfr .lb{font-weight:500}.tfr .sg{grid-column:2;font-size:12px;color:var(--muted)}
.tfr .n{grid-row:1/3;grid-column:3;text-align:right;font-family:var(--mono);font-size:20px}.tfr .n small{display:block;font-size:11px;color:var(--muted)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.live{font-size:10px;padding:2px 6px;border-radius:10px;background:var(--mint);color:#0a1a10;margin-left:6px;font-weight:700;letter-spacing:.06em}
/* trace */
.ts{display:flex;gap:10px;flex-wrap:wrap}
.ts input{flex:1;min-width:0;height:54px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 16px;font-size:18px;font-family:var(--mono)}
.ts input:focus{outline:2px solid var(--mint);outline-offset:1px}
.recent{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.recent button{border:1px solid var(--line);background:none;border-radius:20px;padding:6px 12px;cursor:pointer;font-family:var(--mono);font-size:13px}
.recent button.f{border-color:rgba(255,81,72,.5)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.meta{display:flex;gap:8px 18px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--muted)}.meta b{color:var(--fg);font-weight:500}
details.stg{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.stg[open]{border-color:rgba(255,255,255,.18)}
details.stg.hasf{border-color:rgba(255,191,60,.45)}
.stg summary{list-style:none;display:grid;grid-template-columns:48px 1fr auto auto;gap:14px;align-items:center;padding:14px 18px;cursor:pointer;min-height:56px}
.stg summary::-webkit-details-marker{display:none}
.stg summary:focus-visible{outline:2px solid var(--mint);outline-offset:-2px}
.stg .no{font-family:var(--display);font-size:26px;font-weight:800}
.stg .tt{font-weight:600}.stg .tt small{display:block;font-weight:400;font-size:12px;color:var(--muted);font-family:var(--mono)}
.stg .tm{font-family:var(--mono);font-size:13px;color:var(--muted)}
.stg .bd{padding:0 18px 16px}
.fxb{margin-bottom:12px;padding:12px 14px;border-radius:10px;background:rgba(255,191,60,.08);border:1px solid rgba(255,191,60,.35);display:grid;gap:6px;font-size:14px}
.fxb .row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fxb .t{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:64px}
.fxb .bad{color:var(--red)}.fxb .ok{color:var(--mint)}
td.bad{color:var(--red)}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
@media (max-width:900px){.screen#work{flex-direction:column}.twin{min-height:40%}.side{width:auto;border-left:0;border-top:1px solid var(--line);flex:1}.grid,.kpis{grid-template-columns:1fr 1fr}.bus{display:none}}
@media (max-width:520px){.grid{grid-template-columns:1fr}.rail{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 <div class="logo">BAKO<small>CHECK STATION</small></div>

<section class="screen" id="work">

 </div>
</section>

<section class="screen" id="dash"><div class="wrap" id="dashW"></div></section>

</div></section>

 const pts=wk.map((w,i)=>[x(i),y(Math.max(50,w.fpy))]);
 svg+=`<path class="ar" d="M${pts[0][0]},${chh-B} L${pts.map(p=>p.join(',')).join(' L')} L${pts.at(-1)[0]},${chh-B} Z"/><path class="ln" d="M${pts.map(p=>p.join(',')).join(' L')}"/>`;
 pts.forEach((p,i)=>svg+=i===pts.length-1?`<circle class="end" cx="${p[0]}" cy="${p[1]}" r="5"/><text class="lbl" x="${p[0]}" y="${p[1]-12}" text-anchor="middle">${Math.round(wk[i].fpy)}%</text>`:`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`);
 wk.forEach((w,i)=>{if(i%2===wk.length%2||i===wk.length-1)svg+=`<text x="${x(i)}" y="${chh-10}" text-anchor="middle">${new Date(w.k).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</text>`});svg+='</svg>';
 // by stage
 const bs=STAGES.map((st,i)=>({n:st.n,c:allF.filter(f=>f.stage===i).length}));const bmx=Math.max(...bs.map(b=>b.c),1);
 const byStage=bs.map(b=>`<span>${b.n}</span><span class="tr"><i class="${b.c===bmx?'mx':''}" style="width:${b.c/bmx*100}%"></i></span><span class="c">${b.c}</span>`).join('');
 // top faults
 const G={};allF.forEach(f=>{const g=G[f.label]||(G[f.label]={label:f.label,stage:f.stage,n:0,m:0});g.n++;if(f.at>=Date.now()-30*864e5)g.m++});
 const top=Object.values(G).sort((a,b)=>b.n-a.n||b.m-a.m).slice(0,5);
 const topH=top.map((g,i)=>`<div class="tfr"><span class="rk">${i+1}</span><span class="lb">${g.label}</span><span class="sg">Stage ${g.stage+1} · ${STAGES[g.stage].n} · ${g.m} in the last 30 days</span><span class="n">${g.n}<small>in 12 weeks</small></span></div>`).join('');
 const last=[...FLEET].sort((a,b)=>b.start-a.start).slice(0,8);
 $('dashW').innerHTML=`<div class="dh"><h2>Line performance</h2><span class="chip">Example data · last 12 weeks</span></div>
 <div class="kpis">
  <div class="kpi"><b>${FLEET.length}</b><span>Vehicles verified</span><small>${recent.length} in the last 4 weeks</small></div>
  <div class="kpi"><b>${fp(recent)}%</b><span>First-pass yield</span><small class="up">↑ from ${fp(first)}% in the first 4 weeks</small></div>
  <div class="kpi"><b style="color:var(--red)">${allF.length}</b><span>Faults caught on the line</span><small>0 reached final inspection</small></div>
  <div class="kpi"><b>${Math.round(saved/60)} h</b><span>Rework time saved</span><small>${Math.round(saved/FLEET.length)} min per vehicle vs ≈ 2 h late fix</small></div></div>
 <div class="cards"><div class="box"><h3>First-pass yield by week <b>bars = vehicles built</b></h3>${svg}</div>
  <div class="box"><h3>Faults by stage</h3><div class="hb">${byStage}</div></div></div>
 <div class="cards"><div class="box"><h3>Recent vehicles</h3><div class="tbl" style="border:0;background:none"><table><thead><tr><th>Chassis</th><th>Date</th><th>Operator</th><th>Faults</th><th>Result</th></tr></thead><tbody>
  ${last.map(v=>{const n=faultsOf(v).length;return`<tr class="click" data-ch="${esc(v.ch)}" tabindex="0"><td class="mono">${esc(v.ch)}${v.live?'<span class="live">LIVE</span>':''}</td><td class="mono">${fmtD(v.start)}</td><td>${esc(v.op)}</td><td class="mono">${n}</td><td>${n?'<span class="pill fx">Fixed on line</span>':'<span class="pill ok">First pass</span>'}</td></tr>`}).join('')}
  </tbody></table></div></div>
  <div class="box"><h3>Top recurring faults</h3><div class="tf">${topH}</div></div></div>`;
 $('dashW').querySelectorAll('tr.click').forEach(r=>{const go=()=>{view('trace');openRec(r.dataset.ch)};r.onclick=go;r.onkeydown=e=>{if(e.key==='Enter')go()}})}

// ---------- traceability ----------
function refreshList(){$('tlist').innerHTML=FLEET.map(v=>`<option value="${esc(v.ch)}">`).join('');
 const rec=[...FLEET].sort((a,b)=>b.start-a.start).slice(0,6);
 $('tRecent').innerHTML='Recent: '+rec.map(v=>`<button type="button" class="${faultsOf(v).length?'f':''}" data-ch="${esc(v.ch)}">${esc(v.ch)}</button>`).join('');
 $('tRecent').querySelectorAll('button').forEach(b=>b.onclick=()=>openRec(b.dataset.ch));
 if(!$('tOut').innerHTML)openRec(rec[0].ch)}
$('tF').onsubmit=e=>{e.preventDefault();openRec($('tq').value)};
function openRec(q){q=(q||'').trim().toUpperCase();let v=FLEET.find(x=>x.ch.toUpperCase()===q)||(/^\d+$/.test(q)&&FLEET.find(x=>x.ch.endsWith(q.padStart(4,'0'))));
 $('tq').value=v?v.ch:q;
 if(!v){$('tOut').innerHTML=`<div class="empty">No build record for “${esc(q)}”. Check the chassis number, or pick one from the recent list.</div>`;return}
 const fs=faultsOf(v),sec=!!v.live,checks=v.stages.reduce((a,s)=>a+s.rows.length,0),conf=v.stages.reduce((a,s)=>a+s.rows.filter(r=>r.manual).length,0);
 const dur=Math.round((v.end-v.start)/60000),durS=dur>=60?`${Math.floor(dur/60)} h ${dur%60} min`:`${dur} min`;
 let h=`<div class="box" style="display:grid;gap:12px"><div class="eyebrow">Assembly record${v.live?' · live from this station':' · example data'}</div>
 <div class="dh" style="gap:12px"><h2 style="font-family:var(--display);font-size:48px;margin:0;letter-spacing:.04em">${esc(v.ch)}</h2>${fs.length?`<span class="pill fx">Verified · ${fs.length} fault${fs.length>1?'s':''} fixed on line</span>`:'<span class="pill ok">Verified · first pass</span>'}</div>
 <div class="meta"><span>Order <b>${esc(v.ord)}</b></span><span>Battery <b>${esc(v.bat)}</b></span><span>Colour <b>${v.col}</b></span><span>Operator <b>${esc(v.op)}</b> · ${v.shift}</span><span>Built <b>${fmtD(v.start)}</b> ${fmtT(v.start)}–${fmtT(v.end)}</span></div>
 <div class="kpis"><div class="kpi"><b>${checks}</b><span>Readings logged</span></div><div class="kpi"><b>${conf}</b><span>Operator sign-offs</span></div><div class="kpi"><b style="color:${fs.length?'var(--red)':'var(--fg)'}">${fs.length}</b><span>Faults caught</span></div><div class="kpi"><b style="font-size:32px">${durS}</b><span>Build time</span></div></div></div>
 <div style="display:flex;justify-content:flex-end"><button class="btn" id="tAll" type="button">Expand all stages</button></div>`;
 v.stages.forEach(s=>{const st=STAGES[s.idx],f=s.fault;
  h+=`<details class="stg${f?' hasf':''}" ${f?'open':''}><summary><span class="no">${String(s.idx+1).padStart(2,'0')}</span><span class="tt">${st.title}<small>${s.rows.length} checks · ${s.att} attempt${s.att>1?'s':''}</small></span><span class="tm">${fmtT(s.checkAt,sec)}</span>${f?'<span class="pill fx">Fixed</span>':'<span class="pill ok">Passed</span>'}</summary><div class="bd">`;
  if(f)h+=`<div class="fxb"><div class="row"><span class="t">${fmtT(f.at,sec)}</span><span class="bad"><b>Fault:</b> ${esc(f.label)}</span></div>
   <div class="row"><span class="t"></span><span>${esc(f.item)} read <span class="bad">${f.v}${f.u?' '+f.u:''}</span> · expected ${f.r} · ${f.src}</span></div>
   <div class="row"><span class="t">${fmtT(f.fixedAt,sec)}</span><span class="ok">Fixed by ${esc(f.by)} in ${f.fixMin} min · re-check passed</span></div></div>`;
  h+=`<div class="tbl"><table><thead><tr><th>Check</th><th>Reading</th><th>Expected</th><th>Source</th><th>Time</th><th>By</th></tr></thead><tbody>${s.rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="mono">${r.v}${r.u?' '+r.u:''}</td><td class="mono">${r.r}</td><td class="mono" style="color:var(--muted)">${r.src}</td><td class="mono">${fmtT(r.at,true)}</td><td>${r.manual?esc(r.by):'<span style="color:var(--muted)">station</span>'}</td></tr>`).join('')}</tbody></table></div></div></details>`});
 $('tOut').innerHTML=h;
 $('tAll').onclick=()=>{const ds=$('tOut').querySelectorAll('details');const open=[...ds].some(d=>!d.open);ds.forEach(d=>d.open=open);$('tAll').textContent=open?'Collapse all stages':'Expand all stages'}}
</script>

</body></html>
